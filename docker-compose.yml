name: feynman
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feynman}
      POSTGRES_USER: ${POSTGRES_USER:-feynman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - feynman_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  feynman_pgdata:

